[settings]
experimental = true
lockfile = true

[tools]
"aqua:elixir-lang/expert" = "latest"
"aqua:ip7z/7zip" = "latest"
elixir = "1.20.3"
elixir-ls = "latest"
erlang = "29"
gh = "latest"
pkl = "latest"
python = "3.14"
watchexec = "latest"
zig = "0.16.0"
"conda:xz-tools" = "latest"

[env]
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
ELIXIR_ERL_OPTIONS = "+fnu"
# Keep Mix and Hex data in the project (Be sure to ignore those directories in `.gitignore`)
MIX_HOME = "{{config_root}}/.mise-mix"
HEX_HOME = "{{config_root}}/.mise-hex"
ERL_AFLAGS = "-kernel shell_history enabled"
# Put executables from Mix and Hex directories in $PATH
_.path = [
  "{{env.MIX_HOME}}/bin",
  "{{env.MIX_HOME}}/escripts",
  "{{env.HEX_HOME}}/bin",
]

[hooks]
postinstall = ["mise run setup"]

[tasks.setup]
run = """
mix local.hex --force
mix local.rebar --force
"""

[tasks.escript]
run = """
MIX_ENV=escript mix escript.build
"""

[tasks.gen-workflows]
description = 'Regenerates GitHub Actions YAML (SHA-pinned via DependabotManagedActions) from the Pkl sources'
run = "pkl eval --project-dir .github/ -m .github/ .github/index.pkl"
sources = ['.github/index.pkl', '.github/workflows/*.pkl', '.github/PklProject*']
outputs = [
  '.github/workflows/test.yml',
  '.github/workflows/main.yml',
  '.github/workflows/__lockfile__.yml',
  '.github/dependabot.yml',
]

[tasks.deps-prod]
run = "mix deps.get --only prod"

[tasks.release]
description = 'Builds the Burrito release; set BURRITO_TARGET to build a single target'
run = "MIX_ENV=prod mix release --overwrite"

[tasks.do-all]
run = """
mix deps.get --only prod
elixir images/build-images-readme.exs
MIX_ENV=prod mix release --overwrite
"""

[tasks.test]
# TODO: fail if release-notes/<version>.md is missing — version-info.exs
# requires it to create a non -dev GitHub release.
run = """
mix deps.get
mix test
mix format --check-formatted
"""

[tasks.version-info-only]
run = """
MIX_APPLICATION_VERSION=$(elixir -e 'Regex.run(~r/version: "(.*)"/, File.read!("mix.exs"), capture: :all_but_first) |> List.first() |> IO.puts()')
echo "version $MIX_APPLICATION_VERSION"
"""
